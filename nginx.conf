server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Без слеша в кінці "/admin" не матчить "location /admin/" нижче і
    # провалюється в SPA-заглушку (index.html) — редіректимо на "/admin/".
    # $scheme тут завжди "http" (nginx не знає, що зовні його термінує
    # HTTPS через Cloudflare Tunnel), а на непарному порту (8080, не 80)
    # nginx сам дописує його в Location — разом це давало непридатний
    # ззовні редирект "http://warehouse.mom:8080/admin/". Жорстко https
    # (сайт публічно й не доступний інакше) + $http_host замість $host,
    # щоб зберегти оригінальний Host від клієнта як є.
    location = /admin {
        return 301 https://$http_host/admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
    }

    # index.html і PWA service worker/маніфест — НІКОЛИ не кешувати:
    # інакше браузер може довго показувати стару версію застосунку
    # (стара index.html посилається на JS/CSS файли з хешем, яких вже
    # немає на диску після наступного деплою — саме тому нові фічі не
    # з'являлись у деяких браузерах, доки не почистиш кеш вручну)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:webmanifest|json)$ {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # JS/CSS з хешем у назві файлу — можна кешувати надовго,
    # ім'я змінюється при кожному новому білді
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
